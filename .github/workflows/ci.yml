name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apiuser
          POSTGRES_PASSWORD: apipass
          POSTGRES_DB: apidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://apiuser:apipass@localhost:5432/apidb
      TEST_DATABASE_URL: postgresql://apiuser:apipass@localhost:5432/apidb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: apipass
        run: psql -h localhost -U apiuser -d apidb -c "CREATE DATABASE apidb_test;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Run tests
        run: pytest
